[package]
name = "kernelpop"
version = "1.1.1"
edition = "2021"
description = "KernelPop — GTK4 GUI for installing Ubuntu mainline kernels"
authors = ["Alex Brown"]

[[bin]]
name = "kernelpop"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
glib = "0.22"
gio = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["stream"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
futures-util = "0.3"
scraper = "0.27"
regex = "1"
